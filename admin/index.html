<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | لوحة التحكم</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../src/css/variables.css">
<link rel="stylesheet" href="../src/css/animations.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page">

<div class="login-card fade-in-up">
  <img id="loginLogo" src="" alt="" style="display:none;width:56px;height:56px;border-radius:14px;object-fit:cover;margin:0 auto 14px;">
  <h1>🔐 <span id="loginPlatformName">لوحة تحكم المتجر</span></h1>
  <p class="sub">سجّل الدخول لإدارة الطلبات والمنتجات</p>

  <form id="loginForm">
    <div class="form-group">
      <label>اسم المستخدم</label>
      <input type="text" id="username" class="form-control" required autocomplete="username">
    </div>
    <div class="form-group">
      <label>كلمة المرور</label>
      <input type="password" id="password" class="form-control" required autocomplete="current-password">
    </div>
    <button type="submit" id="loginBtn" class="btn btn-primary btn-block btn-lg">
      <span id="loginBtnText">تسجيل الدخول</span>
    </button>
  </form>
</div>

<div class="platform-footer" id="platformFooter"></div>

<script src="../config/config.js"></script>
<script src="../src/js/utils.js"></script>
<script src="../src/js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
